name: Release

# Push a tag like v0.6.0 to build the Windows app and attach it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . "pyinstaller>=6.10"
      - name: Build
        run: >
          pyinstaller packaging/launcher.py --name Pinganillo --windowed --noconfirm
          --icon packaging/pinganillo.ico --collect-data pinganillo --collect-data faster_whisper --collect-binaries ctranslate2 --collect-all onnxruntime
          --copy-metadata faster-whisper
      - name: Smoke test (the frozen app boots and exits cleanly)
        shell: pwsh
        run: |
          $p = Start-Process dist\Pinganillo\Pinganillo.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip
        run: Compress-Archive -Path dist\Pinganillo -DestinationPath Pinganillo-${{ github.ref_name }}-windows-x64.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: Pinganillo-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
