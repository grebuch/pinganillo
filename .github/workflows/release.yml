name: Release

# A maintainer publishes a GitHub release (tag vX.Y.Z, or vX.Y.Z-rc.N marked as
# pre-release). This workflow then builds the Windows app from that tag, smoke-tests
# it and attaches the zip and its SHA-256 checksum to the release. Publishing stays
# a human decision; building and attaching is automatic.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e . "pyinstaller>=6.10" packaging
      - name: Tag must match the package version
        shell: python
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          import os
          from packaging.version import Version
          import pinganillo
          tag, package = Version(os.environ["TAG"].lstrip("v")), Version(pinganillo.__version__)
          assert tag == package, f"tag {tag} != package version {package}"
          print(f"version {package} OK")
      - name: Build
        run: >
          pyinstaller packaging/launcher.py --name Pinganillo --windowed --noconfirm
          --icon packaging/pinganillo.ico --collect-data pinganillo --collect-data faster_whisper
          --collect-binaries ctranslate2 --collect-all onnxruntime --copy-metadata faster-whisper
      - name: Smoke test (the frozen app boots and exits cleanly)
        shell: pwsh
        run: |
          $p = Start-Process dist\Pinganillo\Pinganillo.exe -ArgumentList '--version' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Zip and checksum
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $zip = "Pinganillo-$env:TAG-windows-x64.zip"
          Compress-Archive -Path dist\Pinganillo -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File -Encoding ascii "$zip.sha256"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            Pinganillo-${{ github.event.release.tag_name }}-windows-x64.zip
            Pinganillo-${{ github.event.release.tag_name }}-windows-x64.zip.sha256
          tag_name: ${{ github.event.release.tag_name }}
