[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pinganillo"
version = "0.6.0"
description = "Local-first live meeting copilot: on-device transcription, live concept explanations and answer hints."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "grebuch" }]
keywords = ["whisper", "transcription", "meetings", "llm", "ollama", "local-first", "wasapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "faster-whisper>=1.1,<2",
    "openai>=1.68,<3",
    "requests>=2.32,<3",
    "PyJWT[crypto]>=2.10,<3",
    "SoundCard>=0.4.3,<0.5",
    "PySide6-Essentials>=6.7,<7",
    "PyAudioWPatch>=0.2.12.6,<0.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
pinganillo-cli = "pinganillo.__main__:main"
pinganillo-bench = "pinganillo.bench:main"

[project.gui-scripts]
pinganillo = "pinganillo.__main__:main"

[project.urls]
Homepage = "https://github.com/grebuch/pinganillo"
Issues = "https://github.com/grebuch/pinganillo/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pinganillo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Spanish text legitimately uses typographic characters


[tool.ruff.lint.per-file-ignores]
# Translation tables and the demo script are prose; wrapping them would hurt readability.
"src/pinganillo/i18n.py" = ["E501"]
"src/pinganillo/demo.py" = ["E501"]
